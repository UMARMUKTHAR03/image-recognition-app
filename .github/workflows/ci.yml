name: Image Recognition App CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Backend PyTest Suite
        run: |
          pytest backend/tests/test_api.py -v

  frontend-build-and-deploy:
    name: Frontend Vitest, Build & Deploy
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test -- --run

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npx tsc -b

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "https://image-recognition-api-bgzb.onrender.com"

      - name: Sync Root Files for GitHub Pages
        run: |
          mkdir -p assets
          cp -r frontend/dist/assets/* assets/ || true
          cp frontend/dist/index.html index.html
          cp frontend/dist/index.html 404.html

      - name: Deploy to gh-pages Branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false
          force_orphan: false
