<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(21, 31, 50, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="jetHeatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0000ff"/>
      <stop offset="25%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00ff00"/>
      <stop offset="75%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #ffffff; }
    .subtitle { font-weight: 500; fill: #94a3b8; }
    .card-title { font-size: 11px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 24px; font-weight: 700; fill: #f8fafc; }
    .metric-sub { font-size: 11px; font-weight: 500; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Subtle Top Decorative Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="200" y1="0" x2="200" y2="680" />
    <line x1="450" y1="0" x2="450" y2="680" />
    <line x1="750" y1="0" x2="750" y2="680" />
    <line x1="1000" y1="0" x2="1000" y2="680" />
  </g>

  <!-- Top Bar / Header -->
  <rect x="50" y="32" width="1100" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo Icon -->
  <rect x="68" y="44" width="40" height="40" rx="10" fill="url(#cyanBlueGrad)"/>
  <circle cx="88" cy="64" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="88" cy="64" r="3" fill="#ffffff"/>

  <!-- Branding -->
  <text x="122" y="59" class="font-sans title" font-size="18">Image Recognition App — Deep Learning Computer Vision Platform</text>
  <text x="122" y="77" class="font-sans subtitle" font-size="11">See. Recognize. Understand. • Engineered by Umar Mukthar</text>

  <!-- Status Pill -->
  <rect x="940" y="47" width="190" height="34" rx="17" fill="#030712" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="958" cy="64" r="4" fill="#10b981"/>
  <text x="970" y="68" class="font-sans" font-size="11" font-weight="600" fill="#34d399">PYTORCH CPU ENGINE</text>

  <!-- Telemetry Row (4 Cards) -->
  <!-- Card 1: Backbone -->
  <g transform="translate(50, 114)">
    <rect width="260" height="92" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="font-sans card-title">Model Architecture</text>
    <text x="20" y="58" class="font-sans metric-value">MobileNetV3-Small</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#22d3ee">MobileNet_V3_Small_Weights.DEFAULT</text>
  </g>

  <!-- Card 2: Taxonomy -->
  <g transform="translate(330, 114)">
    <rect width="260" height="92" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="font-sans card-title">Taxonomy Scope</text>
    <text x="20" y="58" class="font-sans metric-value">ImageNet-1K</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#34d399">1,000 Verified Object Classes</text>
  </g>

  <!-- Card 3: Explainability -->
  <g transform="translate(610, 114)">
    <rect width="260" height="92" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="font-sans card-title">Explainable AI (XAI)</text>
    <text x="20" y="58" class="font-sans metric-value">Grad-CAM</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#c084fc">features.12 Conv2d Layer Saliency</text>
  </g>

  <!-- Card 4: Full Stack -->
  <g transform="translate(890, 114)">
    <rect width="260" height="92" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" class="font-sans card-title">Production Stack</text>
    <text x="20" y="58" class="font-sans metric-value">React 19 + FastAPI</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#38bdf8">Vite 6 • TypeScript 5 • Render Free</text>
  </g>

  <!-- Main Content Layout (2 Columns) -->

  <!-- Left Column: Vision Studio & Softmax Top-5 Probability Distribution -->
  <g transform="translate(50, 224)">
    <rect width="540" height="420" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>

    <text x="24" y="36" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Vision Studio • Softmax Class Distribution</text>
    <text x="24" y="54" class="font-sans subtitle" font-size="11">Genuine probability distribution evaluated from 224×224 normalized RGB tensor</text>

    <!-- Top Predicted Badge -->
    <rect x="24" y="72" width="492" height="66" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="44" y="96" class="font-sans card-title" fill="#06b6d4">Top Predicted Category (#207)</text>
    <text x="44" y="122" class="font-sans" font-size="18" font-weight="800" fill="#ffffff">golden retriever</text>
    <text x="440" y="112" class="font-sans" font-size="22" font-weight="800" fill="#22d3ee">99.71%</text>

    <!-- Bar 1 -->
    <text x="24" y="165" class="font-sans" font-size="11" font-weight="600" fill="#e2e8f0">1. golden retriever (#207)</text>
    <text x="460" y="165" class="font-sans" font-size="11" font-weight="700" fill="#22d3ee">99.71%</text>
    <rect x="24" y="174" width="492" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="174" width="490" height="10" rx="5" fill="url(#cyanBlueGrad)"/>

    <!-- Bar 2 -->
    <text x="24" y="210" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">2. Labrador retriever (#208)</text>
    <text x="470" y="210" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">0.09%</text>
    <rect x="24" y="219" width="492" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="219" width="16" height="10" rx="5" fill="#475569"/>

    <!-- Bar 3 -->
    <text x="24" y="255" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">3. Irish setter (#205)</text>
    <text x="470" y="255" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">0.04%</text>
    <rect x="24" y="264" width="492" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="264" width="12" height="10" rx="5" fill="#475569"/>

    <!-- Bar 4 -->
    <text x="24" y="300" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">4. cocker spaniel (#219)</text>
    <text x="470" y="300" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">0.03%</text>
    <rect x="24" y="309" width="492" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="309" width="10" height="10" rx="5" fill="#475569"/>

    <!-- Bar 5 -->
    <text x="24" y="345" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">5. kuvasz (#222)</text>
    <text x="470" y="345" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">0.02%</text>
    <rect x="24" y="354" width="492" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="354" width="8" height="10" rx="5" fill="#475569"/>

    <!-- Bottom Pill Note -->
    <rect x="24" y="378" width="492" height="26" rx="6" fill="#030712" stroke="#1e293b"/>
    <text x="36" y="395" class="font-sans" font-size="10" fill="#94a3b8">✓ Zero fabricated latency • Measured forward pass latency: 50–95 ms</text>
  </g>

  <!-- Right Column: Grad-CAM Explainable AI Visualizer -->
  <g transform="translate(610, 224)">
    <rect width="540" height="420" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>

    <text x="24" y="36" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Explainable AI • Grad-CAM Feature Attribution</text>
    <text x="24" y="54" class="font-sans subtitle" font-size="11">Gradient-weighted Class Activation Mapping computed on Conv2d layer features.12</text>

    <!-- Visual Heatmap Representation Box -->
    <rect x="24" y="72" width="492" height="230" rx="12" fill="#000000" stroke="#334155" stroke-width="1"/>
    
    <!-- Abstract representation of saliency overlay -->
    <rect x="80" y="90" width="380" height="190" rx="8" fill="#1e293b" opacity="0.6"/>
    <circle cx="270" cy="180" r="70" fill="url(#jetHeatGrad)" opacity="0.85" filter="url(#glow)"/>
    <circle cx="270" cy="180" r="40" fill="#ff0000" opacity="0.9" filter="url(#glow)"/>
    
    <text x="270" y="185" class="font-sans" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Canine Salient Region</text>
    <text x="270" y="200" class="font-sans" font-size="9" font-weight="500" fill="#ffffff" text-anchor="middle">High Feature Activation (Red/Warm)</text>

    <!-- Colormap Legend -->
    <g transform="translate(24, 316)">
      <rect width="492" height="12" rx="4" fill="url(#jetHeatGrad)"/>
      <text x="0" y="26" class="font-sans" font-size="9" fill="#94a3b8">0.0 (Neutral/Cool)</text>
      <text x="246" y="26" class="font-sans" font-size="9" fill="#94a3b8" text-anchor="middle">0.5 (Moderate Relevance)</text>
      <text x="492" y="26" class="font-sans" font-size="9" fill="#94a3b8" text-anchor="end">1.0 (Maximum Saliency)</text>
    </g>

    <!-- Feature Layer Info Badge -->
    <rect x="24" y="364" width="492" height="40" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="38" y="382" class="font-sans" font-size="10" font-weight="600" fill="#c084fc">CONVOLUTIONAL ACTIVATION MAP</text>
    <text x="38" y="396" class="font-sans" font-size="10" fill="#94a3b8">Target Layer: model.features[-1] (576 channels) • Squeeze-and-Excitation Hardswish</text>
  </g>
</svg>
